<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 150" role="img"
     aria-label="A wing with a flap behind it. The flap is carried on a support at each end and driven from a single input at the left-hand end, so drive has to travel the whole span.">
  <title>Transferring torque and motion</title>
  <style>
    .box  { fill:none; stroke:#9a9aa2; stroke-width:1.5; }
    .part { fill:#e9eaee; stroke:#1e1e24; stroke-width:1.6; }
    .sup  { fill:#ffc000; stroke:#1e1e24; stroke-width:1; }
    .pin  { fill:#55555e; stroke:#1e1e24; stroke-width:1; }
    .lnk  { fill:none; stroke:#1e1e24; stroke-width:2; }
    .t    { font:600 11px "Trebuchet MS",sans-serif; fill:#1e1e24; }
    .sad  { font:600 13px "Trebuchet MS",sans-serif; fill:#b01c2e; }
  </style>

  <!-- the panel the original draws the assembly inside -->
  <rect class="box" x="30" y="14" width="300" height="118" rx="3"/>

  <!-- wing -->
  <text x="132" y="34" class="t">Wing</text>
  <rect class="part" x="60" y="40" width="238" height="34"/>

  <!-- hinge pins, one at each end of the span -->
  <rect class="pin" x="59" y="55" width="6" height="30"/>
  <rect class="pin" x="293" y="53" width="6" height="30"/>

  <!-- flap, carried on a support at each end -->
  <rect class="part" x="66" y="88" width="226" height="32"/>
  <rect class="sup" x="60" y="88" width="6" height="32"/>
  <rect class="sup" x="292" y="88" width="6" height="32"/>
  <text x="150" y="109" class="t">Flap</text>
  <text x="185" y="110" class="sad">☹</text>

  <!-- the single drive input, at the left-hand end only -->
  <rect class="part" x="34" y="56" width="18" height="13"/>
  <line class="lnk" x1="52" y1="62" x2="60" y2="62"/>
  <path d="M6 56 L28 56 L28 52 L38 60 L28 68 L28 64 L6 64 z" fill="#ff0000"/>
  <path d="M6 72 L28 72 L28 68 L38 76 L28 84 L28 80 L6 80 z" fill="#0070c0"/>
  <text x="34" y="144" class="t">drive in at one end</text>
</svg>
